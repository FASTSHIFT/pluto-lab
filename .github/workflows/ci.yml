name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- commit lint
  commit-lint:
    name: Commit Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Commit messages (Conventional Commits, English only)
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}"
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"
            # A force push (or a rewritten history) leaves `before` unreachable,
            # so fall back to validating the whole history. The root commit is
            # exempt, which keeps this cheap and always resolvable.
            if [ -n "$BEFORE" ] \
               && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              RANGE="${BEFORE}..${AFTER}"
            else
              echo "::notice::previous head is unreachable (force push?), checking the full history"
              RANGE="HEAD"
            fi
          fi
          echo "range: ${RANGE}"
          python scripts/check_commit_msg.py --range "${RANGE}" || {
            echo "::error::commit message rejected"
            exit 1
          }

  # ---------------------------------------------------------------- style
  style:
    name: Style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install ruff

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: English only (no CJK in sources)
        run: python scripts/check_no_chinese.py

      - name: File line limit
        run: python scripts/check_file_lines.py

      - name: Tool boundaries
        run: python -m pytest -q tests/test_architecture.py -v

  # ---------------------------------------------------------------- tests
  # One combination on purpose: these are pure-python logic tests and the goal
  # is a fast gate, not a compatibility matrix. Add runners back only when a
  # Windows-specific bug actually shows up.
  test:
    name: Tests (ubuntu, py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest pytest-cov

      - name: Unit tests with coverage
        run: python -m pytest -q tests --cov=sdr --cov-report=term-missing --cov-fail-under=85
